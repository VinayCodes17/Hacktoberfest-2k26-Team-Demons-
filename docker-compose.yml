version: '3.8'

services:
  web:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - app_network

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - app_data:/data
      - model_cache:/models
    depends_on:
      - qdrant
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app_network

volumes:
  app_data:
  qdrant_data:
  model_cache:

networks:
  app_network:
    driver: bridge
