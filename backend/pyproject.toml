[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hisabhparakh"
version = "0.1.0"
description = "Evidence-grounded voucher classification contracts"
requires-python = ">=3.13"
dependencies = ["openpyxl==3.1.5", "pydantic==2.14.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
