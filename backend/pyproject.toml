[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hisabhparakh"
version = "0.1.0"
description = "Evidence-grounded voucher classification contracts"
requires-python = ">=3.13"
dependencies = [
  "openpyxl==3.1.5", "pydantic==2.14.0", "fastapi==0.143.0",
  "uvicorn==0.54.0", "sqlalchemy==2.1.4", "alembic==1.20.0",
  "pydantic-settings==2.15.0", "httpx==0.28.1", "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0", "types-openpyxl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["app/settings.py", "app/schemas.py", "app/persistence", "app/readiness.py", "app/main.py", "app/ports.py", "app/logging_config.py", "app/ingestion", "app/normalization"]
